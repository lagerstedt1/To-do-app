<!DOCTYPE html>
<html lang="en">

<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <!-- displays site properly based on user's device -->

  <link rel="stylesheet" href="styles.css">

  <title>Todo app</title>

  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link href="https://fonts.googleapis.com/css2?family=Josefin+Sans:ital,wght@0,100..700;1,100..700&display=swap"
    rel="stylesheet">

  <link rel="icon" type="image/png" sizes="32x32" href="./images/favicon-32x32.png">

  <style>
    body {
    margin: 0;
    background-color: rgb(24, 24, 36);
    font-family: 'Josefin Sans', Arial;
    font-size: 20px;
    color: grey;
}
.canvas {
  padding: 40px;
  display: flex;
  align-items: center;
  position: relative;
  z-index: 101;
}
.card {
  align-items: center;
  display: flex;
  flex-direction: column;
  width: 100%;
}
    .task-container {
      display: flex;
      align-items: center;
      cursor: pointer;
    }
    .todo-list-container .task-container {
      border-bottom: 2px solid rgb(57, 59, 83);
      color: white;
    }
    .create-todo-container {
      margin-bottom: 40px;
      margin-top: 20px;
  background-color: rgb(37,39,60);
      border-radius: 10px;
      padding: 10px;
      width: 80%;
    }
    .bottom-card-container {
  background-color: rgb(37,39,60);
      border-radius: 10px;
      padding: 10px;
      width: 80%;      
      margin-bottom: 20px;
      box-shadow: 0 20px 30px rgba(0, 0, 0, 0.5);
    }
    .title-and-themebutton-container {
      display: flex;
      align-items: center;
      font-size: 40px;
      font-weight: 600;
      color: white;
      width: 80%;
      justify-content: space-between;
    }
    .theme-button {
      background: none;
      border: none;
    }
    .info-and-filters-container {
      display: flex;
      padding-top: 20px;
      justify-content: space-between;
      font-size: 18px;
    }
    .task-status-button {
      margin-right: 20px;
    }
    .helper-text {
      font-size: 18px;
    }
    .background-picture img {
      z-index: 1;
      left: 0;
      right: 0;
      top: 0;
      width: 100%;
    }
    .background-picture {
      z-index: 1;
      position: absolute;
      top: 0;
    }
    .create-task-text {
      font-family: 'Josefin Sans';
  background-color: rgb(37,39,60);
      border: none;
      color: grey;
      font-size: 20px;
      width: 90%;
      padding-top: 10px;
      padding-bottom: 10px;
    }
    .filter-activation-text, .filter-activation-all {
      text-decoration: none;
    }
    .filter-activation-all {
      color: rgb(12, 97, 255);
    }
    .filter-activation-text {
      color: grey;
      transition: 0.15s;
    }
    .clear-completed-text {
      color: grey;
      text-decoration: none;
      transition: 0.15s;
    }
    .clear-completed-text:hover {
      color: white;
    }
    .filter-activation-text:hover {
      color: white;
    }

    @media (min-width: 768px) {
      .mobile-dark-bg {
        display: none;
      }
    }

    @media (max-width: 768px) {
      .create-todo-container {
        width: 100%;
      }
      .bottom-card-container {
        width: 100%;
      }
      .desktop-dark-bg {
        display: none;
      }
    }

    .light-canvas {
      background-color: white;
    }
    .light-bottom-card-container {
      background-color: white;
    }
    
  </style>
</head>
<body class="active-body">
  <picture class="background-picture">
    <img class="mobile-dark-bg" src="images/bg-mobile-dark.jpg" media="(max-width: 768px)">
    <img class="desktop-dark-bg" src="images/bg-desktop-dark.jpg" alt="">
  </picture>
  <div class="canvas">
    <div class="card">
      <div class="title-and-themebutton-container">
        <p class="large-title-text"> TODO </p>
        <button class="js-theme-button theme-button" onclick="
        lightModeOn();
        ">
          <img src="images/icon-sun.svg" alt="">
        </button>
      </div>
      
      <div class="create-todo-container">
        <div class="task-container">
          <button class="task-status-button"></button>
          <input class="create-task-text" placeholder="Create a new todo...">
        </div>
      </div>

      <div class="bottom-card-container">
        
      <div class="todo-list-container">
        <div class="task-container">
          <button class="task-status-button"></button>
          <p class="task-text"> Task text goes here </p>
        </div>
      </div>
        
              <div class="info-and-filters-container">
        <div class="num-items-text">
          5 items left
        </div>
        <div class="filter-container">
          <a class="filter-activation-all" href="#">
            all
          </a>
          <a class="filter-activation-text" href="#">
            active
          </a>
          <a class="filter-activation-text" href="#">
            completed
          </a>
        </div>
        <a class="clear-completed-text" href="#">
          clear completed
        </a>
              </div>
      </div>
      
      <p class="helper-text">
        Drag and drop to reorder list
      </p>
    </div>
  </div>
</body>
<script>
  function lightModeOn() {
    const canvasElement = document.querySelector('.canvas');
    const bottomCard = document.querySelector('.bottom-card-container')
    

    if (canvasElement && bottomCard) {
    canvasElement.classList.toggle('light-canvas');
    bottomCard.classList.toggle('light-bottom-card-container');
    }
   
  }
</script>
</html>
