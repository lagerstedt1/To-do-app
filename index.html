<!DOCTYPE html>
<html lang="en">

<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <!-- displays site properly based on user's device -->


  <title>Todo app</title>

  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link href="https://fonts.googleapis.com/css2?family=Josefin+Sans:ital,wght@0,100..700;1,100..700&display=swap"
    rel="stylesheet">

  <link rel="icon" type="image/png" sizes="32x32" href="./images/favicon-32x32.png">

  <link rel="stylesheet" href="styles/todo.css">
</head>
<body>
  <picture class="background-picture">
    <img class="mobile-dark-bg" src="images/bg-mobile-dark.jpg" media="(max-width: 768px)">
    <img class="desktop-dark-bg" src="images/bg-desktop-dark.jpg" alt="">
    <img class="mobile-light-bg" src="images/bg-mobile-light.jpg">
    <img class="desktop-light-bg" src="images/bg-desktop-light.jpg">
  </picture>
  <div class="canvas">
    <div class="card">
      <div class="title-and-themebutton-container">
        <p class="large-title-text"> TODO </p>
        <button class="js-theme-button theme-button" onclick="
        lightModeOn();
        ">
          <img class="icon-sun" src="images/icon-sun.svg" alt="">
          <img class="icon-moon" src="images/icon-moon.svg">
        </button>
      </div>
      
      <div class="create-todo-container">
        <div class="task-container">
          <button class="task-status-button"></button>
          <input class="create-task-text" placeholder="Create a new todo...">
        </div>
      </div>

      <div class="bottom-card-container">
        
      <div class="todo-list-container">
        <div class="task-container">
          <button class="task-status-button"></button>
          <p class="task-text"> Task text goes here </p>
        </div>
      </div>
        
              <div class="info-and-filters-container">
        <div class="num-items-text">
          5 items left
        </div>
        <div class="filter-container">
          <a class="filter-activation-all" href="#">
            all
          </a>
          <a class="filter-activation-text" href="#">
            active
          </a>
          <a class="filter-activation-text" href="#">
            completed
          </a>
        </div>
        <a class="clear-completed-text" href="#">
          clear completed
        </a>
              </div>
      </div>
      
      <p class="helper-text">
        Drag and drop to reorder list
      </p>
    </div>
  </div>
</body>
<script src="scripts/todo.js">

</script>
</html>
